name: parabank-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install virtual display (xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Chrome version (preinstalled)
        run: google-chrome --version || google-chrome-stable --version

      - name: Run TestNG suite under virtual display
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" mvn -B -ntp test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: ignore
          retention-days: 14
